<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trackover</title>
        <script>
            // GitHub Pages serves 404.html for any path it can't resolve.
            // We use it as a router: if the requested path is /track/<tripId>,
            // stash the tripId in sessionStorage and redirect to /track/
            // (which then reads it and renders the live-tracking view).
            ;(function () {
                var m = window.location.pathname.match(/^\/track\/([^/?]+)/)
                if (m) {
                    sessionStorage.setItem("trackover.tripId", m[1])
                    window.location.replace(
                        "/track/" +
                            window.location.search +
                            window.location.hash,
                    )
                }
            })()
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            ink: "#050A14",
                            cyan: "#67E8FF",
                        },
                        fontFamily: {
                            sans: [
                                "Inter",
                                "ui-sans-serif",
                                "system-ui",
                                "sans-serif",
                            ],
                        },
                    },
                },
            }
        </script>
    </head>
    <body
        class="flex h-screen items-center justify-center bg-ink font-sans text-white antialiased"
    >
        <div class="text-center">
            <p class="text-sm font-semibold tracking-[0.24em] text-cyan/80">
                TRACKOVER.LIVE
            </p>
            <h1 class="mt-4 text-4xl font-extrabold tracking-tight">
                Page not found
            </h1>
            <p class="mt-3 text-white/55">
                The page you’re looking for doesn’t exist.
            </p>
            <a
                href="/"
                class="mt-6 inline-block rounded-lg border border-white/15 px-4 py-2 text-sm font-semibold text-white/85 hover:bg-white/5"
                >Back home</a
            >
        </div>
    </body>
</html>
