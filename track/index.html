<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trackover — Live Tracking</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            ink: "#050A14",
                            cyan: "#67E8FF",
                            blue: "#4F7CFF",
                        },
                        fontFamily: {
                            sans: [
                                "Inter",
                                "ui-sans-serif",
                                "system-ui",
                                "sans-serif",
                            ],
                        },
                    },
                },
            }
        </script>
        <script src="/js/config.js"></script>
        <style>
            html,
            body,
            #map {
                height: 100%;
            }
        </style>
    </head>
    <body class="bg-ink font-sans text-white antialiased">
        <div id="map" class="absolute inset-0 z-0"></div>

        <!-- top bar -->
        <header
            class="absolute inset-x-0 top-0 z-10 flex items-center justify-between px-6 py-4 backdrop-blur-md bg-ink/70 border-b border-white/10"
        >
            <a href="/" class="flex items-center gap-2">
                <span class="text-sm font-semibold tracking-[0.24em] text-white/80"
                    >TRACKOVER.LIVE</span
                >
            </a>
            <div id="user-area" class="flex items-center gap-3 text-sm">
                <span class="text-white/40">Loading…</span>
            </div>
        </header>

        <!-- bottom info panel -->
        <section
            id="info-panel"
            class="absolute bottom-4 left-4 right-4 sm:left-auto sm:w-[360px] z-10 hidden rounded-xl border border-white/10 bg-ink/85 p-4 backdrop-blur-md shadow-2xl"
        >
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs uppercase tracking-widest text-white/45">
                        Trip
                    </p>
                    <p
                        id="trip-id"
                        class="mt-0.5 font-mono text-sm break-all text-white/90"
                    >
                        —
                    </p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="status-dot" class="h-2 w-2 rounded-full bg-white/30"></span>
                    <span id="status-text" class="text-xs text-white/70">idle</span>
                </div>
            </div>
            <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
                <div>
                    <p class="text-xs uppercase tracking-widest text-white/45">Lat</p>
                    <p id="lat" class="font-mono text-white/90">—</p>
                </div>
                <div>
                    <p class="text-xs uppercase tracking-widest text-white/45">Lng</p>
                    <p id="lng" class="font-mono text-white/90">—</p>
                </div>
            </div>
            <p class="mt-2 text-xs text-white/45">
                Last update: <span id="last-update" class="font-mono">—</span>
            </p>
        </section>

        <!-- overlay used for "not signed in" / "no location" / errors -->
        <div
            id="overlay"
            class="absolute inset-0 z-20 flex items-center justify-center bg-ink/80 backdrop-blur"
        >
            <div
                class="max-w-sm rounded-2xl border border-white/10 bg-ink/95 p-8 text-center shadow-2xl"
            >
                <p id="overlay-title" class="text-lg font-semibold">Loading…</p>
                <p id="overlay-body" class="mt-2 text-sm text-white/60"></p>
                <button
                    id="overlay-action"
                    class="mt-6 hidden rounded-lg bg-cyan px-4 py-2 text-sm font-semibold text-ink hover:bg-cyan/80"
                ></button>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
        <script type="module">
            const cfg = window.TrackoverConfig

            // ---- resolve tripId from URL or sessionStorage (set by 404.html) -------
            function resolveTripId() {
                // Direct visit to /track/<tripId> would be a 404; 404.html redirects here.
                const stashed = sessionStorage.getItem("trackover.tripId")
                if (stashed) {
                    sessionStorage.removeItem("trackover.tripId")
                    history.replaceState({}, "", "/track/" + stashed)
                    return stashed
                }
                const m = window.location.pathname.match(/^\/track\/([^/?]+)/)
                if (m) return m[1]
                const qp = new URLSearchParams(window.location.search).get("id")
                return qp || null
            }

            const tripId = resolveTripId()

            // ---- overlay helpers ----------------------------------------------------
            const overlay = document.getElementById("overlay")
            const overlayTitle = document.getElementById("overlay-title")
            const overlayBody = document.getElementById("overlay-body")
            const overlayAction = document.getElementById("overlay-action")

            function showOverlay(title, body, actionLabel, actionFn) {
                overlayTitle.textContent = title
                overlayBody.textContent = body || ""
                if (actionLabel) {
                    overlayAction.textContent = actionLabel
                    overlayAction.classList.remove("hidden")
                    overlayAction.onclick = actionFn
                } else {
                    overlayAction.classList.add("hidden")
                    overlayAction.onclick = null
                }
                overlay.classList.remove("hidden")
            }
            function hideOverlay() {
                overlay.classList.add("hidden")
            }

            // ---- early validation ---------------------------------------------------
            if (!tripId) {
                showOverlay(
                    "No trip selected",
                    "Open a tracking link like trackover.live/track/<tripId>.",
                )
                throw new Error("no tripId")
            }

            // ---- map setup ----------------------------------------------------------
            const map = L.map("map", { zoomControl: true }).setView(
                cfg.MAP.FALLBACK_CENTER,
                4,
            )
            L.tileLayer(cfg.MAP.TILE_URL, {
                attribution: cfg.MAP.TILE_ATTRIBUTION,
                maxZoom: 19,
            }).addTo(map)

            let marker = null
            function renderLocation(lat, lng) {
                if (!marker) {
                    marker = L.marker([lat, lng]).addTo(map)
                    map.setView([lat, lng], cfg.MAP.DEFAULT_ZOOM)
                } else {
                    marker.setLatLng([lat, lng])
                }
            }

            // ---- status indicator ---------------------------------------------------
            const dot = document.getElementById("status-dot")
            const statusText = document.getElementById("status-text")
            function setStatus(state) {
                // state: "live" | "waiting" | "error"
                dot.className =
                    "h-2 w-2 rounded-full " +
                    {
                        live: "bg-emerald-400 shadow-[0_0_10px_2px] shadow-emerald-400/60 animate-pulse",
                        waiting: "bg-amber-400",
                        error: "bg-rose-500",
                    }[state]
                statusText.textContent = {
                    live: "live",
                    waiting: "waiting…",
                    error: "error",
                }[state]
            }

            // ---- Clerk loader -------------------------------------------------------
            function loadClerk() {
                return new Promise((resolve, reject) => {
                    const s = document.createElement("script")
                    s.src = `https://${cfg.CLERK_DOMAIN}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`
                    s.async = true
                    s.crossOrigin = "anonymous"
                    s.dataset.clerkPublishableKey = cfg.CLERK_PUBLISHABLE_KEY
                    s.onload = async () => {
                        try {
                            await window.Clerk.load()
                            resolve(window.Clerk)
                        } catch (e) {
                            reject(e)
                        }
                    }
                    s.onerror = () => reject(new Error("Failed to load Clerk JS"))
                    document.head.appendChild(s)
                })
            }

            // ---- API client ---------------------------------------------------------
            async function fetchLiveLocation(clerk) {
                const token = await clerk.session.getToken()
                const url = `${cfg.API_BASE}/v1/consumer/trip/${encodeURIComponent(
                    tripId,
                )}/location`
                const res = await fetch(url, {
                    headers: { Authorization: `Bearer ${token}` },
                })
                return { status: res.status, body: await res.json().catch(() => null) }
            }

            // ---- user area + sign-in/out -------------------------------------------
            function renderUserArea(clerk) {
                const el = document.getElementById("user-area")
                el.innerHTML = ""
                if (!clerk.user) {
                    const btn = document.createElement("button")
                    btn.textContent = "Sign in"
                    btn.className =
                        "rounded-lg bg-cyan px-3 py-1.5 text-xs font-semibold text-ink hover:bg-cyan/80"
                    btn.onclick = () =>
                        clerk.openSignIn({ redirectUrl: window.location.href })
                    el.appendChild(btn)
                    return
                }
                const email = document.createElement("span")
                email.className = "text-white/70"
                email.textContent =
                    clerk.user.primaryEmailAddress?.emailAddress || clerk.user.id
                const signOut = document.createElement("button")
                signOut.textContent = "Sign out"
                signOut.className =
                    "rounded-md border border-white/15 px-2.5 py-1 text-xs text-white/70 hover:text-white"
                signOut.onclick = () =>
                    clerk.signOut().then(() => window.location.reload())
                el.append(email, signOut)
            }

            // ---- poll loop ----------------------------------------------------------
            let pollTimer = null
            async function pollOnce(clerk) {
                try {
                    const { status, body } = await fetchLiveLocation(clerk)
                    if (status === 200 && body?.result) {
                        const { lat, lng, ts } = body.result
                        renderLocation(lat, lng)
                        document.getElementById("trip-id").textContent = tripId
                        document.getElementById("lat").textContent = lat.toFixed(6)
                        document.getElementById("lng").textContent = lng.toFixed(6)
                        document.getElementById("last-update").textContent =
                            new Date(ts).toLocaleTimeString()
                        document
                            .getElementById("info-panel")
                            .classList.remove("hidden")
                        setStatus("live")
                        hideOverlay()
                    } else if (status === 404) {
                        setStatus("waiting")
                        document.getElementById("trip-id").textContent = tripId
                        document
                            .getElementById("info-panel")
                            .classList.remove("hidden")
                        showOverlay(
                            "Waiting for location…",
                            "No location received for this trip yet. This page will update automatically.",
                        )
                    } else if (status === 401 || status === 403) {
                        setStatus("error")
                        showOverlay(
                            "Access denied",
                            body?.error?.message ||
                                "You don't have permission to view this trip.",
                            "Sign in with a different account",
                            () =>
                                clerk.signOut().then(() => window.location.reload()),
                        )
                        stopPolling()
                    } else {
                        setStatus("error")
                        showOverlay(
                            "Something went wrong",
                            body?.error?.message ||
                                `HTTP ${status}. Retrying in ${cfg.POLL_INTERVAL_MS / 1000}s.`,
                        )
                    }
                } catch (err) {
                    setStatus("error")
                    showOverlay(
                        "Network error",
                        err.message +
                            " — check that the API is reachable and CORS is allowed.",
                    )
                }
            }

            function startPolling(clerk) {
                stopPolling()
                pollOnce(clerk)
                pollTimer = setInterval(
                    () => pollOnce(clerk),
                    cfg.POLL_INTERVAL_MS,
                )
            }
            function stopPolling() {
                if (pollTimer) {
                    clearInterval(pollTimer)
                    pollTimer = null
                }
            }
            window.addEventListener("beforeunload", stopPolling)

            // ---- bootstrap ----------------------------------------------------------
            ;(async () => {
                showOverlay("Loading…", "Signing you in.")
                try {
                    const clerk = await loadClerk()
                    renderUserArea(clerk)
                    clerk.addListener(({ user }) => {
                        renderUserArea(clerk)
                        if (user) startPolling(clerk)
                        else stopPolling()
                    })
                    if (!clerk.user) {
                        showOverlay(
                            "Sign in to view this trip",
                            "Tracking is gated behind your Clerk account.",
                            "Sign in",
                            () =>
                                clerk.openSignIn({
                                    redirectUrl: window.location.href,
                                }),
                        )
                        return
                    }
                    startPolling(clerk)
                } catch (e) {
                    showOverlay("Failed to initialize", e.message)
                }
            })()
        </script>
    </body>
</html>
